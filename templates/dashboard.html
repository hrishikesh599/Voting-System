<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>School voting System</title>
        <style>
            :root{
                --primary:#3b82f6;
                --accent:#60a5fa;
                --text-light:#f9fafb;
                --card-dark: rgba(15, 23, 42, 0.95);
            }
            body{
                margin:0;
                padding:0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: var(--text-light);
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                overflow: hidden;
                background: linear-gradient(-45deg, #1e3a8a, #0f172a, #1e40af, #0a0f2c);
                background-size: 400% 400%;
                animation: gradientAnimation 15s ease infinite; 
            }
            @keyframes gradientShift {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }
             .container {
                background-color: var(--card-dark);
                padding: 3rem 2rem;
                border-radius: 1rem;
                box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
                max-width: 600px;
                width: 90%;
                text-align: center;
                backdrop-filter: blur(12px);
                animation: fadeIn 1.2s ease;
            }
             h1 {
                font-size: 2.5rem;
                margin-bottom: 2.5rem;
                color: var(--accent);
                letter-spacing: 1px;
                text-shadow: 0 0 10px rgba(96, 165, 250, 0.4);
            }
            .btn-group {
                display: flex;
                justify-content: center;
                gap: 2rem;
                flex-wrap: wrap;
            }
             button {
                background-color: var(--primary);
                color: var(--text-light);
                border: none;
                padding: 1rem 2.5rem;
                border-radius: 0.75rem;
                font-size: 1.2rem;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
            }
             button:hover {
                background-color: var(--accent);
                transform: translateY(-3px) scale(1.05);
                box-shadow: 0 8px 25px rgba(96, 165, 250, 0.7);
            }
            a {
                text-decoration: none;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.95); }
                to { opacity: 1; transform: scale(1); }
            }
            @media (max-width: 500px) {
                h1 {
                    font-size: 2rem;
                }
                button {
                    width: 100%;
                    padding: 1rem;
                }
                .btn-group {
                    flex-direction: column;
                    gap: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>School Voting System</h1>
            <div class="btn-group">
                <a href="/admin"><button>Admin Mode</button></a>
                <a href="/user"><button>User Mode</button></a>
            </div>
        </div>
        <div style="
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(15,23,42,0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(96,165,250,0.2);
        color: rgba(249,250,251,0.7);
        font: 500 13px 'Segoe UI', sans-serif;
        letter-spacing: 1.5px;
        box-shadow: 0 0 20px rgba(96,165,250,0.12);
        z-index:9999;">DESIGNED &amp; DEVELOPED BY <span style="color:#60a5fa;">HRISHIKESH T HEMANTH</span>
        </div>
    </body>
</html>
