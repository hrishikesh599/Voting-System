
<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/static/style[admin].css">
  <script>
    function fetchResults() {
      fetch('/live-results')
        .then(response => response.json())
        .then(data => {
          const resultContainer = document.getElementById("live-results");
          const voteStats = document.getElementById("vote-stats");
          resultContainer.innerHTML = "";

          let totalVotes = 0;
          let maxVotes = {{ max_votes }};

          data.forEach(candidate => {
            const el = document.createElement("div");
            el.className = "card flex";
            el.innerHTML = `<strong>${candidate.name}</strong><span>${candidate.votes} votes</span>`;
            resultContainer.appendChild(el);
            totalVotes += candidate.votes;
          });

          voteStats.innerText = `🗳️ Votes Cast: ${totalVotes} | 📉 Remaining: ${Math.max(0, maxVotes - totalVotes)}`;
        });
    }

    setInterval(fetchResults, 5000);
    window.onload = fetchResults;
  </script>
</head>
<body>
  <div class="card" style="max-width: 800px; margin: auto;">
    <h1>Admin Panel</h1>

    <!-- Add New Class -->
    <section class="card">
      <h2>Add New Class</h2>
      <form method="POST">
        <input type="text" name="class_name" placeholder="Class Name" required>
         <input type="number" name="max_voters" placeholder="Max Voters (e.g. 100)" required>
        <div class="card">
        <input type="text" name="candidate_names" placeholder="Candidate Name 1" required>
        <input type="text" name="candidate_names" placeholder="Candidate Name 2">
        <input type="text" name="candidate_names" placeholder="Candidate Name 3">
        </div>
        <button type="submit" class="button">Add Class & Candidates</button>
      </form>
    </section>

    <!-- Set Active Class -->
    <section class="card">
      <h2>Set Active Voting Class</h2>
      <form method="POST">
        <select name="set_active_class">
          {% for cls in classes %}
            <option value="{{ cls.id }}" {% if cls.id == active_class_id %}selected{% endif %}>
              {{ cls.name }}
            </option>
          {% endfor %}
        </select>
        <button type="submit" class="button">Set Active</button>
      </form>
    </section>

    <!-- Add Candidate -->
    <section class="card">
      <h2>Add Candidate to Active Class</h2>
      <form action="/add-candidate" method="POST">
        <input type="text" name="candidate_name" placeholder="New Candidate Name" required>
        <button type="submit" class="button">Add Candidate</button>
      </form>
    </section>

    <!-- Live Results -->
    <section class="card">
      <h2>Live Results</h2>
      <div id="vote-stats" class="mb-2" style="font-size: 0.9rem; color: #f1f5f9;"></div>
      <div id="live-results" class="scroll-box"></div>
    </section>

<!-- Reset Votes -->
<section class="card">
  <h2>Reset Votes for a Class</h2>
  <form action="/reset_votes" method="POST" onsubmit="return confirm('Are you sure you want to reset all votes for this class? This cannot be undone.')">
    <select name="class_id" required>
      {% for cls in classes %}
        <option value="{{ cls.id }}">{{ cls.name }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="button" style="background-color: #b91c1c;">Reset Votes</button>
  </form>
</section>



    <!-- Export Results -->
    <section class="card">
      <h2>Export Results</h2>
      <form action="/export_results" method="POST">
        <button type="submit" class="button" style="background-color: #dc2626;">Export as PDF</button>
      </form>
    </section>

    <!-- Home Button -->
    <div class="center mt-4">
      <a href="/"><button class="button">HOME</button></a>
    </div>
  </div>
  <div style="
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 22px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(96,165,250,0.2);
  border-radius: 1rem;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  color: #cbd5e1;
  font-family: 'Segoe UI', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 1px;
  z-index: 9999;">Designed & Developed by <span style="color:#60a5fa;font-weight:600;">HRISHIKESH T HEMANTH</span>
  </div>
</body>
</html>
